{% extends "tarefas/base.html" %}

{% block titulo %}Excluir tarefa{% endblock %}

{% block conteudo %}
<div class="card">
    <h2>Excluir tarefa</h2>

    <p>
        Tem certeza de que deseja excluir
        <strong>{{ tarefa.titulo }}</strong>?
    </p>

    <form method="post">
        {% csrf_token %}

        <button type="submit" class="excluir">
            Sim, excluir
        </button>

        <a href="{% url 'lista_tarefas' %}" class="btn">
            Cancelar
        </a>
    </form>
</div>
{% endblock %}
